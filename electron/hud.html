<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>О.Л.Е.Г. — HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .hud-stage {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-stage.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Фоновое рассеянное свечение (Aura Glow) */
    .hud-glow {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.45) 0%, rgba(112, 0, 255, 0.25) 55%, transparent 75%);
      filter: blur(10px);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    /* Пульсирующие внешние кольца звука */
    .hud-ripple {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 240, 255, 0.6);
      opacity: 0;
      pointer-events: none;
      transform: scale(1);
    }

    /* Основная неоновая сфера (Orb) */
    .hud-orb {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4df7ff 0%, #00b4d8 35%, #7b2cbf 75%, #0d0922 100%);
      box-shadow: 
        0 0 16px rgba(0, 240, 255, 0.7),
        0 0 32px rgba(123, 44, 191, 0.45),
        inset 0 0 10px rgba(255, 255, 255, 0.8),
        inset 0 -4px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s ease-out, filter 0.25s ease, background 0.3s ease;
      z-index: 2;
    }

    /* Блик на сфере */
    .hud-orb::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 10px;
      width: 12px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      filter: blur(1px);
      transform: rotate(-25deg);
    }

    /* Кольцевой индикатор загрузки (Processing Spinner) */
    .hud-spinner {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top: 2.5px solid #00f0ff;
      border-right: 2.5px solid rgba(0, 240, 255, 0.5);
      border-bottom: 2.5px solid transparent;
      border-left: 2.5px solid transparent;
      opacity: 0;
      transform: rotate(0deg) scale(0.85);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 3;
    }

    .hud-spinner-inner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px dashed rgba(168, 85, 247, 0.7);
      opacity: 0;
      transform: rotate(0deg);
      transition: opacity 0.3s ease;
      z-index: 3;
    }

    /* ---------------------------------------------
       СОСТОЯНИЕ 1: Молчание / Ожидание команды (Listening Idle)
       Медленное, плавное, мягкое дыхание
       --------------------------------------------- */
    .state-listening-idle .hud-orb {
      animation: idleBreathing 2.4s ease-in-out infinite;
    }

    .state-listening-idle .hud-glow {
      animation: glowBreathing 2.4s ease-in-out infinite;
    }

    @keyframes idleBreathing {
      0%, 100% {
        transform: scale(0.95);
        filter: brightness(0.95);
      }
      50% {
        transform: scale(1.08);
        filter: brightness(1.2);
      }
    }

    @keyframes glowBreathing {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    /* ---------------------------------------------
       СОСТОЯНИЕ 2: Голос пользователя (Listening Voice)
       Управляется напрямую через RMS громкости
       --------------------------------------------- */
    .state-listening-voice .hud-ripple {
      animation: soundRipple 1.1s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }

    @keyframes soundRipple {
      0% {
        transform: scale(0.9);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* ---------------------------------------------
       СОСТОЯНИЕ 3: Обработка запроса (Processing Loading)
       Трансформация в футуристическую загрузку
       --------------------------------------------- */
    .state-processing .hud-orb {
      transform: scale(0.72);
      filter: brightness(0.85);
      background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #0284c7 40%, #4f46e5 80%, #030712 100%);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .state-processing .hud-spinner {
      opacity: 1;
      transform: scale(1);
      animation: spinOuter 0.9s linear infinite;
    }

    .state-processing .hud-spinner-inner {
      opacity: 1;
      animation: spinInner 1.4s linear infinite reverse;
    }

    @keyframes spinOuter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinInner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------------------------------------------
       СОСТОЯНИЕ 4: Завершено успешно (Done)
       Мягкая изумрудная вспышка успеха
       --------------------------------------------- */
    .state-done .hud-orb {
      transform: scale(1.1);
      background: radial-gradient(circle at 35% 30%, #6ee7b7 0%, #10b981 40%, #047857 80%, #022c22 100%);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.9);
      filter: brightness(1.2);
    }

    .state-done .hud-glow {
      background: radial-gradient(circle, rgba(52, 211, 153, 0.5) 0%, rgba(16, 185, 129, 0.25) 55%, transparent 75%);
      transform: scale(1.3);
      opacity: 1;
    }

    /* ---------------------------------------------
       СОСТОЯНИЕ 5: Скрыт (Hidden)
       --------------------------------------------- */
    .state-hidden {
      opacity: 0 !important;
      transform: scale(0.6) !important;
    }
  </style>
</head>
<body>
  <div class="hud-stage state-hidden" id="hud-stage">
    <div class="hud-glow" id="hud-glow"></div>
    <div class="hud-ripple" id="hud-ripple"></div>
    <div class="hud-spinner" id="hud-spinner"></div>
    <div class="hud-spinner-inner" id="hud-spinner-inner"></div>
    <div class="hud-orb" id="hud-orb"></div>
  </div>

  <script>
    const stage = document.getElementById("hud-stage");
    const orb = document.getElementById("hud-orb");
    const glow = document.getElementById("hud-glow");
    const ripple = document.getElementById("hud-ripple");

    let currentState = "hidden";
    let voiceFadeTimer = null;
    let targetScale = 1.0;
    let currentScale = 1.0;
    let animFrame = null;

    // Плавная интерполяция размера сферы под громкость речи (Lerp)
    function updateOrbPhysics() {
      if (currentState === "listening-voice") {
        currentScale += (targetScale - currentScale) * 0.35;
        orb.style.transform = `scale(${currentScale.toFixed(3)})`;
        glow.style.transform = `scale(${(currentScale * 1.15).toFixed(3)})`;
        animFrame = requestAnimationFrame(updateOrbPhysics);
      } else {
        animFrame = null;
      }
    }

    function setState(newState) {
      if (currentState === newState && newState !== "listening-voice") return;
      currentState = newState;

      // Очищаем старые классы состояний
      stage.classList.remove(
        "state-listening-idle",
        "state-listening-voice",
        "state-processing",
        "state-done",
        "state-hidden"
      );

      if (newState === "hide" || newState === "hidden") {
        stage.classList.add("state-hidden");
        stage.classList.remove("visible");
        orb.style.transform = "";
        glow.style.transform = "";
        targetScale = 1.0;
        currentScale = 1.0;
        return;
      }

      // Показываем индикатор
      stage.classList.add("visible");

      if (newState === "listening-idle") {
        stage.classList.add("state-listening-idle");
        orb.style.transform = "";
        glow.style.transform = "";
        targetScale = 1.0;
      } else if (newState === "listening-voice") {
        stage.classList.add("state-listening-voice");
        if (!animFrame) {
          animFrame = requestAnimationFrame(updateOrbPhysics);
        }
      } else if (newState === "processing") {
        stage.classList.add("state-processing");
        orb.style.transform = "";
        glow.style.transform = "";
      } else if (newState === "done") {
        stage.classList.add("state-done");
      }
    }

    function handleAudioLevel(rms) {
      if (currentState !== "listening-voice" && currentState !== "listening-idle") return;

      if (rms > 0.016) {
        if (currentState !== "listening-voice") {
          setState("listening-voice");
        }
        // Масштабируем сферу пропорционально громкости речи
        // RMS обычно в диапазоне 0.02 - 0.25 при разговоре
        const boost = Math.min(Math.max((rms - 0.015) * 5.2, 0), 0.65);
        targetScale = 1.0 + boost;

        // Если пользователь замолчал, через 350мс возвращаемся в плавное дыхание
        if (voiceFadeTimer) clearTimeout(voiceFadeTimer);
        voiceFadeTimer = setTimeout(() => {
          if (currentState === "listening-voice") {
            setState("listening-idle");
          }
        }, 380);
      }
    }

    // Слушаем IPC обновления от бэкенда/renderer через preload
    if (window.oleg && window.oleg.onHudUpdate) {
      window.oleg.onHudUpdate((data) => {
        if (!data) return;
        if (data.type === "audio-level") {
          handleAudioLevel(data.rms || 0);
        } else if (data.state) {
          setState(data.state);
        }
      });
    }
  </script>
</body>
</html>
